name: Compile kernel

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Get AOSP Clang
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r574158.tar.gz -O clang.tar.gz
          mkdir -p aosp-clang
          tar -xzf clang.tar.gz -C aosp-clang

      - name: Update submodule
        run: git submodule init && git submodule update

      - name: Compile kernel
        run: |
          chmod +x ./scripts/compile.sh
          ./scripts/compile.sh -d vendor/xiaomi/alioth_defconfig -c $PWD/aosp-clang -u Rve -H RvEnterprises

      - name: Upload Image & DTBO
        uses: actions/upload-artifact@v4
        with:
          name: RvKernel-Alioth
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dtbo.img

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: out/compile.log
