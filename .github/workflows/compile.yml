name: Alpha Kernel Build - Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          # Use depth 1 to avoid history issues and speed up
          fetch-depth: 1
          # Do not fetch submodules yet to see if it fixes the error
          submodules: false
          # Ensure it uses the correct branch
          ref: lineage-23.1-ksu-next

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm clang libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libtinfo5 dos2unix

      - name: Setup Toolchain
        run: |
          mkdir -p aosp-clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r574158.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C aosp-clang

      - name: Patch Defconfig
        run: |
          DEFCONFIG_FILE="arch/arm64/configs/vendor/xiaomi/alioth_defconfig"
          if [ -f "$DEFCONFIG_FILE" ]; then
            echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
            echo "CONFIG_KSU_NEXT_GEN_IPTABLES=y" >> $DEFCONFIG_FILE
            echo "# CONFIG_KSU_DEBUG is not set" >> $DEFCONFIG_FILE
            echo "Defconfig patched."
          else
            echo "Defconfig not found at $DEFCONFIG_FILE"
            # List files to find the correct path if it fails
            find arch/arm64/configs -name "*defconfig"
            exit 1
          fi

      - name: Run Build Script
        run: |
          dos2unix scripts/compile.sh
          chmod +x scripts/compile.sh
          # Use absolute path for Clang
          ./scripts/compile.sh \
            -d vendor/xiaomi/alioth_defconfig \
            -c $GITHUB_WORKSPACE/aosp-clang \
            -u Alpha \
            -H RvEnterprises

      - name: Upload Result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlphaKernel-Alioth
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dtb.img
